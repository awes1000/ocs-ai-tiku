services:
  ocs-tiku:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocs-tiku:latest
    container_name: ocs-tiku
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "${PORT:-8060}:8060"
    environment:
      - PORT=8060
      - HOST=0.0.0.0
      - DB_PATH=/app/data/tiku.db
      - TRUST_PROXY=${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_TYPE=${AI_API_TYPE:-chat_completions}
      - AI_PROXY=${AI_PROXY:-}
      - ALLOW_ANONYMOUS=${ALLOW_ANONYMOUS:-false}
    volumes:
      - ./data:/app/data
